<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}The Wise Fool - A blend of philosophy, psychology, humor and insights on life,with wit and occasional wisdom.{% endblock %}">
    <meta name="keywords" content="philosophy, psychology, satire, mental health, wisdom, humor, life advice, social commentary">
    <meta name="author" content="The Wise Fool">
    <meta name="msvalidate.01" content="59FD170CE5AAEF21805AC2466A71E743" />
    
    <!-- Canonical URL to prevent duplicate content issues -->
    <link rel="canonical" href="https://wisefool.xyz{{ request.path }}" />
    
    <!-- Favicon with proper format -->
    <link rel="icon" href="{{url_for('static', filename='images/clown.png')}}" type="image/png">
    <link rel="apple-touch-icon" href="{{url_for('static', filename='images/clown.png')}}">
    
    <!-- Social media tags -->
    <meta property="og:url" content="https://wisefool.xyz{{ request.path }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="The Wise Fool | Philosophy & Psychology with a Twist">
    <meta property="og:description" content="{% block og_description %}Where wisdom wears a jester's hat - philosophy, psychology, and insights on life's complexities with humor and occasional accidental brilliance.{% endblock %}">
    <meta property="og:image" content="https://wisefool.xyz{{url_for('static', filename='images/clown.png')}}">
    
    <!-- Twitter Card data -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="The Wise Fool | Philosophy & Psychology with a Twist">
    <meta name="twitter:description" content="{% block twitter_description %}Where wisdom wears a jester's hat - philosophy, psychology, and insights delivered with wit.{% endblock %}">
    
    <title>{% block page_title %}The Wise Fool | Philosophy, Psychology & Humor{% endblock %}</title>
    <link rel="sitemap" type="application/xml" title="Sitemap" href="{{ url_for('sitemap.sitemap') }}">
    <!-- CSS with improved loading -->
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='styling/custom.css')}}">
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='styling/body.css')}}">
    <link rel="preload" href="{{url_for('static',filename='styling/articles.css')}}" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="{{url_for('static',filename='styling/articles.css')}}"></noscript>
    <link id="theme" rel="stylesheet" type="text/css" href="{{url_for('static',filename='styling/light.css')}}">
    <link rel="preload" href="{{url_for('static',filename='styling/comments.css')}}" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="{{url_for('static',filename='styling/comments.css')}}"></noscript>
    
    <!-- Preconnect to Google fonts for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat&family=Shadows+Into+Light&family=Kalam&display=swap" rel="stylesheet">

    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "ql4psbtfw6");
  </script>
</head>
<body>
    <nav class="custom-navbar">
        <div class="custom-container">
          <div class="navbar-content">
            <div class="navbar-left">
              <button type="button" class="navbar-toggle" id="navbar-toggle">
                <div class="hamburger">
                  <span></span>
                  <span></span>
                  <span></span>
                </div>
              </button>
              <a class="navbar-brand" href="{{url_for('home.home')}}">ThE wIsE foOl</a>
            </div>
            
            <div class="navbar-right">
              
              <div class="auth-buttons">
                <a href="{{url_for('login.login')}}" class="auth-button login-button">
                  <span class="glyphicon glyphicon-log-in"></span> Login
                </a>
                <a href="{{url_for('register_user.register_user')}}" class="auth-button signup-button">
                  <span class="glyphicon glyphicon-user"></span> Signup
                </a>
              </div>
            </div>
          </div>
      
          <div class="navbar-collapse" id="navbar-collapse">
            <ul class="nav navbar-nav">
              <li><a href="{{url_for('home.home')}}">Home</a></li>
              <li><a href="{{url_for('about.about')}}">About</a></li>
              <li><a href="{{url_for('help.help')}}">Help</a></li>
              <li><a href="{{url_for('terms.terms')}}">Terms</a></li>
            </ul>
          </div>
        </div>
      </nav>
    <div class="body-container">
        <div class="custom-title">
            {% block title %}
            {% endblock %}
        </div>
        <div class="content">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <footer class="custom-footer">
      <div class="footer-content">
          <div class="footer-links">
              <a href="{{url_for('about.about')}}">About</a>
              <a href="{{url_for('terms.terms')}}">Terms</a>
             
              
          </div>
          <div class="socials">
              <div class="email">
                  <a href="mailto:oddsthingshere@gmail.com" data-toggle="tooltip" data-placement="top" title="Contact us">
                      <img src="{{url_for('static',filename='images/email.jpg')}}" width="40" height="30" alt="Email us here" loading="lazy">
                  </a>
              </div>
              <!-- Add more social media icons if you have them -->
          </div>
          <div class="copyright">
              <p>&copy; {% raw %}{{ now.year }}{% endraw %} The Wise Fool. All rights reserved.</p>
          </div>
      </div>
  </footer>

   
    <!-- Place before closing body tag -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
      // Menu toggle functionality with accessibility
      const navbarToggle = document.getElementById('navbar-toggle');
      const navbarCollapse = document.getElementById('navbar-collapse');
      
      if (navbarToggle && navbarCollapse) {
          navbarToggle.addEventListener('click', function() {
              const expanded = navbarCollapse.style.display === 'block';
              navbarCollapse.style.display = expanded ? 'none' : 'block';
              navbarToggle.setAttribute('aria-expanded', !expanded);
          });
      }
  });
  </script>
    <!-- Schema.org markup for website -->
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "The Wise Fool",
    "url": "https://wisefool.xyz",
    "description": "Philosophy, psychology, and insights on life's complexities with humor and occasional wisdom",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://wisefool.xyz/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</body>
</html>
