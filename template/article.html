{% extends 'base.html' %}


{% block title %}

    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='styling/comments.css')}}" media="print" onload="this.media='all'">
    
    {{title}}
{% endblock %}

{% block content %}

 {{content | safe}}

 <div class="comments">
    <h2>Comments</h2>
    <div class="add_comment">
        <form id="commentForm" action="{{url_for('add_comment.add_comment')}}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="article_id" value="{{title}}">
            <input type="text" name="author" id="author" placeholder="Your name" required>
            <textarea name="content" placeholder="Share your thoughts..." required></textarea>
            <input type="submit" value="Post Comment">
        </form>
    </div>
    
    <div class="comments-list">
        {% if comments %}
            {% for comment in comments %}
                <div class="comment">
                    <div class="comment-author">{{comment.author}}</div>
                    <div class="comment-content">{{comment.content}}</div>
                </div>
            {% endfor %}
        {% endif %}
    </div>
</div>
 <script>
    const user="fool_user";
    
    document.getElementById('commentForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const author_inp=document.getElementsByName("author")[0];
        const auth_name=author_inp.value;
        window.localStorage.setItem(user,auth_name);
        
        fetch(this.action, {
            method: 'POST',
            body: new FormData(this),
        })
        .then(response => response.json())
        .then(data => {
            // Handle the response, maybe add the new comment to the DOM
            const commentsDiv = document.querySelector('.comments');
            const newComment = `
                <div class="comment">
                    <div class="comment-author">${data.author}</div>
                    <div class="comment-content">${data.content}</div>
                </div>
            `;
            commentsDiv.insertAdjacentHTML('beforeend', newComment);
        })
        .catch(error => console.error('Error:', error));
    });

    

    window.onload=()=>{
        if (!author)return;
        
        const author=window.localStorage.getItem(user);
        const author_inp=document.getElementById("author");
        author_inp.value=author;

        
    }

    </script>
{% endblock %}
